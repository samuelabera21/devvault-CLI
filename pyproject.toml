[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "samuel-devvault"
version = "0.2.0"
description = "A local developer configuration manager"
authors = [
    { name = "Samuel Abera" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/samuelabera21/devvault"
Repository = "https://github.com/samuelabera21/devvault"
Issues = "https://github.com/samuelabera21/devvault/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "build",
]

[project.scripts]
devvault = "devvault.cli:main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
python_version = "3.12"